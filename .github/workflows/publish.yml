name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pin LTS; avoid cache edge-cases on first publishes
          node-version: '22'
      - name: Debug workspace
        run: |
          ls -la
          node -v
          npm -v
          test -f package-lock.json && echo 'lockfile ok' || echo 'NO LOCKFILE'
          python3 - <<'PY'
          import json
          pkg=json.load(open('package.json'))
          lock=json.load(open('package-lock.json'))
          print('pkg', pkg['version'], 'lock', lock.get('version'))
          print('devDeps', sorted(pkg.get('devDependencies', {})))
          print('lockDev', sorted(lock.get('packages', {}).get('', {}).get('devDependencies', {})))
          PY
      - name: Install dependencies
        run: |
          npm install --no-fund --no-audit
      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
